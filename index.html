<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upaj Sahyog — Farm to buyer marketplace</title>
  <meta name="description" content="AI-powered marketplace connecting farmers and FPOs directly with buyers.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="toast" class="toast" role="status"></div>
  <header class="topbar">
    <a class="brand" href="#dashboard" aria-label="Upaj Sahyog home"><span class="brand-mark">US</span><span><b>Upaj Sahyog</b><small>उपज सहयोग</small></span></a>
    <nav id="nav" aria-label="Main navigation">
      <a href="#dashboard" data-page="dashboard">Dashboard</a><a href="#market" data-page="market">Marketplace</a><a href="#matches" data-page="matches">Smart matches</a><a href="#logistics" data-page="logistics">Logistics</a><a href="#impact" data-page="impact">Impact</a>
    </nav>
    <div class="actions"><button id="langBtn" class="ghost">हिंदी</button><button id="userBtn" class="user-chip">Sign in</button></div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer><span>Upaj Sahyog • SIH 2026 • PS 26033</span><span>Transparent prices. Efficient routes. Stronger farmers.</span></footer>
  <dialog id="loginDialog">
    <form method="dialog" id="loginForm">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <span class="eyebrow">DEMO ACCESS</span><h2>Enter the marketplace</h2><p>Choose a role to explore a complete workflow.</p>
      <div class="role-grid">
        <button type="button" data-login="9000000001"><b>Farmer</b><small>List and sell produce</small></button>
        <button type="button" data-login="9000000003"><b>Buyer</b><small>Source verified lots</small></button>
        <button type="button" data-login="9000000004"><b>Admin</b><small>Monitor the network</small></button>
      </div>
      <label>Phone<input id="phone" value="9000000001" inputmode="numeric"></label>
      <label>Password<input id="password" type="password" value="demo123"></label>
      <button class="primary wide" value="default">Sign in securely</button>
      <small class="hint">All demo accounts use password <code>demo123</code>.</small>
    </form>
  </dialog>
  <dialog id="formDialog"><form method="dialog" id="entityForm"><button class="dialog-close" value="cancel">×</button><div id="formBody"></div></form></dialog>
  <script type="module" src="/app.js"></script>
</body></html>
